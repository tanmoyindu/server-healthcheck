name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint with shellcheck
        run: shellcheck healthcheck.sh

      - name: Smoke test (plain output)
        run: bash healthcheck.sh

      - name: Smoke test (JSON output is valid)
        run: bash healthcheck.sh --json | python3 -m json.tool

      - name: Threshold flag works
        run: bash healthcheck.sh --threshold 1 | grep -q "WARNING"
